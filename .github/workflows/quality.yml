name: Quality

# The org's shared code quality checks: the work marker gate, golangci-lint
# (one pinned version, with this repo's .golangci.yml) and the API break gate,
# from luthersystems/.github. Every repo runs the same checks and versions,
# and an org ruleset will require its one check, "quality / result". How to
# make an exception: docs/quality-workflow.md in luthersystems/.github.

# Why push on site-sync too: the sync PR is opened by this repo's
# GITHUB_TOKEN (site-sync-pr.yml), and GitHub runs no pull_request workflow
# for a PR that token opens. The push run reports its check on the same
# commit, so the sync PR still gets "quality / result" (as security.yml does).

on:
  merge_group:
  pull_request:
  push:
    branches: [main, site-sync]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id must stay "quality": the ruleset requires "quality / result".
  quality:
    permissions:
      contents: read
      issues: read # the work marker gate reads each named issue's state
    uses: luthersystems/.github/.github/workflows/quality.yml@v1
    # No inputs: this repo has no Go module, so the lint and API break jobs
    # skip and only the work marker gate runs.
